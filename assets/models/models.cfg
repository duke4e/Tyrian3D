# Tyrian3D: how game objects appear in 3D.
#
# Every enemy and player ship shows its original sprite with generated volume until it gets a
# model of its own. F5 reloads this file while the game runs; TYR3D_MODEL_CONFIG selects another
# file in this directory (models_kenney.cfg: the placeholder models of PoC 2).
#
# An appearance is a model name, "volume" (the sprite with generated volume) or "sprite".
#
# model <name> <file> [size] [yaw] [pitch] [roll]
#   file:  relative to this directory (glb, gltf, obj, fbx)
#   size:  footprint in game pixels (the larger of width and depth); 0 or missing means the
#          model is authored in game pixels (the Tyrian3D convention: Y up, nose towards -Z)
#   yaw/pitch/roll: degrees, turning the model so that its nose points up the screen
#   origin: draw the model at its own origin (the sprite's centre, its base on the layer) rather
#           than centred in height: for pieces of one object, which must meet
#
# player <appearance> [options]          every player ship
# ship <ship id> <appearance> [options]  one ship (ids as in the shop, see the catalogue)
# sidekick <id|any> <appearance> [options]
#                                        sidekicks (ids as in the shop)
#
# enemy <ground|sky|top|any> <1x1|2x2|any> <appearance>... [options]
#   Each enemy type gets one of the listed appearances, so it always looks the same.
#   The first matching rule wins.
#
# sprite <sheet> <first sprite> <appearance> [options]
#   One enemy type: sheet is the enemy shape file letter (newsh?.shp), or coins (the coins and
#   gems sheet) or powerups (the power-ups sheet, "twoplayer" in the catalogue), and the first
#   sprite of its animation, as listed in the catalogue or printed with TYR3D_LOG_ENEMIES=1
#   ('$' is coins, '+' powerups). A sheet named by a symbol can be written x<hex> (x23 for '#').
#
# frame <sheet> <sprite> <model>
#   While an enemy that has a model shows this animation frame, it shows this model instead (with
#   its own options): for frames that change shape (a mouth opening, a claw closing, wings beating).
#
# default <appearance> [options]          enemies no rule matches (default: sprite)
#
# Options:
#   yaw=<degrees>        fixed heading; 0 is up the screen, enemies default to 180 (down)
#   yaw=velocity         face the direction of movement
#   yaw=aim              face the player
#   yaw=frames:<n>[:<first frame yaw>][:ccw]
#                        the animation is a rotation in n steps
#   roll=frames:<n>[:ccw]
#                        the animation is a roll about the nose, a full turn in n frames
#   height=<pixels>      raise or lower the object relative to its layer
#   layer=<ground|sky|top>
#                        drawn at that layer's height whatever layer the game uses (pieces of one
#                        object that levels put on different layers)
#   banking=off          player ships: don't roll with the banking sprites
#   spin=<degrees>       turn this much every frame (items)
#   color=sprite         palette materials take the colour (ramp) of the sprite's current frame:
#                        one grey model for items that come in several colours
#   glow[=<size>[:<strength>[:<palette index>[:<dx>:<dy>]]]]
#                        light around it in a light shade of the sprite's main colour (size in
#                        game pixels; glow alone: 1.25 times the sprite's width); a palette index
#                        gives the glow that colour instead (e.g. a red lamp on a grey ship); dx, dy
#                        move it from the sprite's centre (game pixels, dy down the screen)

