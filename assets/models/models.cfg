# Tyrian3D model replacements.
#
# PoC 2: placeholder CC0 models (Kenney Space Kit) to get a feel for the game with 3D models.
# Sprites without a model keep being drawn as sprites.
#
# model <name> <file> <size> [yaw] [pitch] [roll]
#   file:  relative to this directory (glb, gltf, obj, fbx)
#   size:  footprint in game pixels (the larger of the model's width and depth)
#   yaw/pitch/roll: degrees, turning the model so that its nose points up the screen
#
# player <model>
#
# enemy <ground|sky|top|any> <1x1|2x2|any> <model> [model...]
#   Each enemy sprite gets one of the listed models, so an enemy type always looks the same.
#   The first matching rule wins.
#
# sprite <sheet> <index> <model|none>
#   Exact override for one enemy type; sheet is the enemy shape file letter (newsh?.shp) and
#   index the first sprite of its animation. TYR3D_LOG_ENEMIES=1 prints the ones on screen.

model player    kenney-space-kit/craft_speederA.glb    22
model speederB  kenney-space-kit/craft_speederB.glb    15
model speederC  kenney-space-kit/craft_speederC.glb    15
model speederD  kenney-space-kit/craft_speederD.glb    15
model racer     kenney-space-kit/craft_racer.glb       15
model miner     kenney-space-kit/craft_miner.glb       26
model cargoA    kenney-space-kit/craft_cargoA.glb      26
model cargoB    kenney-space-kit/craft_cargoB.glb      26
model turret1   kenney-space-kit/turret_single.glb     14
model turret2   kenney-space-kit/turret_double.glb     24
model rover     kenney-space-kit/rover.glb             24
model generator kenney-space-kit/machine_generator.glb 24

player player

enemy sky    1x1 speederB speederC speederD racer
enemy sky    2x2 miner cargoA cargoB
enemy top    any miner cargoA cargoB
enemy ground 1x1 turret1
enemy ground 2x2 turret2 rover generator
