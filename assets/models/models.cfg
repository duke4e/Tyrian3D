# Tyrian3D: how game objects appear in 3D.
#
# Every enemy and player ship shows its original sprite with generated volume until it gets a
# model of its own. F5 reloads this file while the game runs; TYR3D_MODEL_CONFIG selects another
# file in this directory (models_kenney.cfg: the placeholder models of PoC 2).
#
# An appearance is a model name, "volume" (the sprite with generated volume) or "sprite".
#
# model <name> <file> [size] [yaw] [pitch] [roll]
#   file:  relative to this directory (glb, gltf, obj, fbx)
#   size:  footprint in game pixels (the larger of width and depth); 0 or missing means the
#          model is authored in game pixels (the Tyrian3D convention: Y up, nose towards -Z)
#   yaw/pitch/roll: degrees, turning the model so that its nose points up the screen
#
# player <appearance> [options]          every player ship
# ship <ship id> <appearance> [options]  one ship (ids as in the shop, see the catalogue)
# sidekick <id|any> <appearance> [options]
#                                        sidekicks (ids as in the shop)
#
# enemy <ground|sky|top|any> <1x1|2x2|any> <appearance>... [options]
#   Each enemy type gets one of the listed appearances, so it always looks the same.
#   The first matching rule wins.
#
# sprite <sheet> <first sprite> <appearance> [options]
#   One enemy type: sheet is the enemy shape file letter (newsh?.shp), or coins (the coins and
#   gems sheet) or powerups (the power-ups sheet, "twoplayer" in the catalogue), and the first
#   sprite of its animation, as listed in the catalogue or printed with TYR3D_LOG_ENEMIES=1
#   ('$' is coins, '+' powerups).
#
# default <appearance> [options]          enemies no rule matches (default: sprite)
#
# Options:
#   yaw=<degrees>        fixed heading; 0 is up the screen, enemies default to 180 (down)
#   yaw=velocity         face the direction of movement
#   yaw=aim              face the player
#   yaw=frames:<n>[:<first frame yaw>][:ccw]
#                        the animation is a rotation in n steps
#   roll=frames:<n>[:ccw]
#                        the animation is a roll about the nose, a full turn in n frames
#   height=<pixels>      raise or lower the object relative to its layer
#   banking=off          player ships: don't roll with the banking sprites
#   spin=<degrees>       turn this much every frame (items)
#   color=sprite         palette materials take the colour (ramp) of the sprite's current frame:
#                        one grey model for items that come in several colours
#   glow[=<size>[:<strength>]]
#                        light around it in a light shade of the sprite's main colour (size in
#                        game pixels; glow alone: 1.25 times the sprite's width)

# Player ships with models of their own (tools/blender/models/ships). Ships sharing a sprite share
# its model; the Nort Ship (12) is drawn in two parts by the game and keeps its sprites.
model talon      ships/talon.glb
model carrot     ships/carrot.glb
model phoenix    ships/phoenix.glb
model stalker    ships/stalker.glb
model uship      ships/uship.glb
model silver     ships/silver.glb
model storm      ships/storm.glb
model dragon     ships/dragon.glb
model gencore2   ships/gencore2.glb
model petezoomer ships/petezoomer.glb
model rumbottle  ships/rumbottle.glb

ship 1  talon       # USP Talon
ship 2  carrot      # SuperCarrot
ship 3  phoenix     # Gencore Phoenix
ship 4  phoenix     # Gencore Maelstrom
ship 5  stalker     # MicroCorp Stalker
ship 6  stalker     # MicroCorp Stalker-B
ship 7  stalker     # Prototype Stalker-C
ship 8  stalker     # Stalker
ship 9  talon       # USP Fang
ship 10 uship       # U-Ship
ship 11 silver      # Silver Ship
ship 13 stalker     # The Stalker 21.126
ship 14 storm       # Storm
ship 15 dragon      # Red Dragon
ship 16 gencore2    # Gencore II
ship 17 petezoomer  # PeteZoomer
ship 18 rumbottle   # Rum Bottle

# Enemies with models of their own (tools/blender/models/enemies).
model ringcore enemies/ringcore.glb
model pod      enemies/pod.glb
model uarch    enemies/uarch.glb

# Episode 1: the ring core (5) and its twin turning the other way (11).
sprite 2 229 ringcore yaw=frames:16:0
sprite 2 243 ringcore yaw=frames:16:157.5:ccw
# The pod (4).
sprite 2 159 pod yaw=0
# The U-arch rolling (10) and rolling back (12).
sprite 2 191 uarch yaw=0 roll=frames:16
sprite 2 205 uarch yaw=0 roll=frames:16:ccw

# Items enemies leave (tools/blender/models/items). The coins flip and the crystals turn as their
# sprites do; one grey model each takes the colour of the sprite's frame.
model purpleball items/purpleball.glb
model coin       items/coin.glb
model gem        items/gem.glb
model crystal    items/crystal.glb
model datacube   items/datacube.glb
model ingot      items/ingot.glb
model capsule    items/capsule.glb

# The purple ball (power for the weapons), the item seen most.
sprite powerups 41 purpleball glow
# Coins: green 10, gold 25, silver 75 and copper 50 credits; half a turn in six frames.
sprite coins 1  coin roll=frames:12 color=sprite
sprite coins 7  coin roll=frames:12 color=sprite
sprite coins 20 coin roll=frames:12 color=sprite
sprite coins 26 coin roll=frames:12 color=sprite
# Gems: red 250, green 100 and blue 500 credits; a quarter turn per sparkle (16 frames).
sprite coins 14 gem yaw=frames:64 color=sprite glow=15:0.3
sprite coins 32 gem yaw=frames:64 color=sprite glow=15:0.3
sprite coins 51 gem yaw=frames:64 color=sprite glow=15:0.3
# Crystals: orange 1000, green 2500 and purple 5000 credits; a sixth of a turn in 18 frames.
sprite coins 39  crystal roll=frames:108 color=sprite glow
sprite coins 77  crystal roll=frames:108 color=sprite glow
sprite coins 115 crystal roll=frames:108 color=sprite glow
# Data cubes, whose animation cycles colours.
sprite coins 159 datacube spin=3 color=sprite glow
sprite coins 191 datacube spin=3 color=sprite glow
# Armour, and the front and rear weapon power-ups.
sprite coins 127 ingot spin=1.5 color=sprite
sprite coins 129 ingot spin=1.5 color=sprite
sprite coins 131 ingot spin=1.5 color=sprite
sprite coins 165 capsule spin=2
sprite coins 203 capsule spin=2

player volume
sidekick any volume
default volume
