# Tyrian3D: how game objects appear in 3D.
#
# Every enemy and player ship shows its original sprite with generated volume until it gets a
# model of its own. F5 reloads this file while the game runs; TYR3D_MODEL_CONFIG selects another
# file in this directory (models_kenney.cfg: the placeholder models of PoC 2).
#
# An appearance is a model name, "volume" (the sprite with generated volume) or "sprite".
#
# model <name> <file> [size] [yaw] [pitch] [roll]
#   file:  relative to this directory (glb, gltf, obj, fbx)
#   size:  footprint in game pixels (the larger of width and depth); 0 or missing means the
#          model is authored in game pixels (the Tyrian3D convention: Y up, nose towards -Z)
#   yaw/pitch/roll: degrees, turning the model so that its nose points up the screen
#
# player <appearance> [options]          every player ship
# ship <ship id> <appearance> [options]  one ship (ids as in the shop, see the catalogue)
#
# enemy <ground|sky|top|any> <1x1|2x2|any> <appearance>... [options]
#   Each enemy type gets one of the listed appearances, so it always looks the same.
#   The first matching rule wins.
#
# sprite <sheet> <first sprite> <appearance> [options]
#   One enemy type: sheet is the enemy shape file letter (newsh?.shp) and the first sprite of its
#   animation, as listed in the catalogue or printed with TYR3D_LOG_ENEMIES=1.
#
# default <appearance> [options]          enemies no rule matches (default: sprite)
#
# Options:
#   yaw=<degrees>        fixed heading; 0 is up the screen, enemies default to 180 (down)
#   yaw=velocity         face the direction of movement
#   yaw=aim              face the player
#   yaw=frames:<n>[:<first frame yaw>][:ccw]
#                        the animation is a rotation in n steps
#   height=<pixels>      raise or lower the object relative to its layer
#   banking=off          player ships: don't roll with the banking sprites

# Player ships with models of their own (tools/blender/models/ships). Ships sharing a sprite share
# its model; the Nort Ship (12) is drawn in two parts by the game and keeps its sprites.
model talon      ships/talon.glb
model carrot     ships/carrot.glb
model phoenix    ships/phoenix.glb
model stalker    ships/stalker.glb
model uship      ships/uship.glb
model silver     ships/silver.glb
model storm      ships/storm.glb
model dragon     ships/dragon.glb
model gencore2   ships/gencore2.glb
model petezoomer ships/petezoomer.glb
model rumbottle  ships/rumbottle.glb

ship 1  talon       # USP Talon
ship 2  carrot      # SuperCarrot
ship 3  phoenix     # Gencore Phoenix
ship 4  phoenix     # Gencore Maelstrom
ship 5  stalker     # MicroCorp Stalker
ship 6  stalker     # MicroCorp Stalker-B
ship 7  stalker     # Prototype Stalker-C
ship 8  stalker     # Stalker
ship 9  talon       # USP Fang
ship 10 uship       # U-Ship
ship 11 silver      # Silver Ship
ship 13 stalker     # The Stalker 21.126
ship 14 storm       # Storm
ship 15 dragon      # Red Dragon
ship 16 gencore2    # Gencore II
ship 17 petezoomer  # PeteZoomer
ship 18 rumbottle   # Rum Bottle

player volume
default volume
