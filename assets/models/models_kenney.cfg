# Tyrian3D, PoC 2: placeholder CC0 models (Kenney Space Kit) to get a feel for the game with 3D
# models. Enemies without a rule keep their sprites. Select with TYR3D_MODEL_CONFIG=models_kenney.cfg;
# the format is described in models.cfg.

model player    kenney-space-kit/craft_speederA.glb    22
model speederB  kenney-space-kit/craft_speederB.glb    15
model speederC  kenney-space-kit/craft_speederC.glb    15
model speederD  kenney-space-kit/craft_speederD.glb    15
model racer     kenney-space-kit/craft_racer.glb       15
model miner     kenney-space-kit/craft_miner.glb       26
model cargoA    kenney-space-kit/craft_cargoA.glb      26
model cargoB    kenney-space-kit/craft_cargoB.glb      26
model turret1   kenney-space-kit/turret_single.glb     14
model turret2   kenney-space-kit/turret_double.glb     24
model rover     kenney-space-kit/rover.glb             24
model generator kenney-space-kit/machine_generator.glb 24

player player

enemy sky    1x1 speederB speederC speederD racer yaw=velocity
enemy sky    2x2 miner cargoA cargoB yaw=velocity
enemy top    any miner cargoA cargoB yaw=velocity
enemy ground 1x1 turret1 yaw=aim
enemy ground 2x2 turret2 rover generator yaw=aim
