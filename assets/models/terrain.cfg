# Terrain of the 3D view's backgrounds (src/background3d.c).
#
#   water <background set> [plain] <level name, or its beginning>
#
# The background's water tiles (mostly saturated blues) are shown as procedural water. Colours
# alone can't tell water from blue metal or rock, so the levels with water are listed here.
# "plain": only the plainly blue pixels are water, also in the tiles that are water in good part
# (CORAL's grey-blue rocks painted into its water tiles stay rock; SAVARA's pale crests are water).
water 1 SAVARA
water 1 plain CORAL
#
#   weather <snow|embers|pollen> <level name, or its beginning>
#
# The 3D view's weather over the level (Effects only): snow falling and drifting at every depth over the
# ice planets, embers rising from the lava, pollen floating and glinting low over the meadows and jungles.
weather snow CAMANIS
weather snow ICE
weather snow DEEP ICE
weather snow GLACIER
weather embers LAVA
weather embers CORE
weather embers THE CORE
weather embers CRUSTGATE
weather embers MINERS
weather pollen TORM
weather pollen BOTANY
weather pollen ROOST
weather pollen JUNGLE
