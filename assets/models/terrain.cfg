# Terrain of the 3D view's backgrounds (src/background3d.c).
#
#   water <background set> [plain] [below <depth>] <level name, or its beginning>
#
# The background's water tiles (mostly saturated blues) are shown as procedural water. Colours
# alone can't tell water from blue metal or rock, so the levels with water are listed here.
# "plain": only the plainly blue pixels are water, also in the tiles that are water in good part
# (CORAL's grey-blue rocks painted into its water tiles stay rock; SAVARA's pale crests are water).
# "below <depth>": on the background's terrain, the water is its blue pixels where the ground lies that many
# pixels below its plane (TORM's river in its channel, sunk 14: its dark painted water and its grass are both
# blue enough to the colours alone; BONUS's and ROOST's rivers, of the same tiles, too); the colour of the
# water is still its plainly blue tiles'.
water 1 SAVARA
water 1 plain CORAL
water 1 plain below 4 TORM
water 1 plain below 4 BONUS
water 1 plain below 4 ROOST
#
#   weather <snow|embers|pollen|sand|leaves|bubbles> <level name, or its beginning>
#
# The 3D view's weather over the level (Effects only): snow falling and drifting at every depth over the
# ice planets, embers rising from the lava, pollen floating and glinting low over the meadows and jungles, sand
# blowing low over the deserts, leaves blown along by the wind, bubbles rising from the sea floor.
weather snow CAMANIS
weather snow ICE
weather snow DEEP ICE
weather snow GLACIER
weather embers LAVA
weather embers CORE
weather embers THE CORE
weather embers CRUSTGATE
weather embers MINERS
weather pollen TORM
weather pollen BOTANY
weather pollen ROOST
weather pollen JUNGLE
weather sand DESERTRUN
weather sand SURFACE
weather sand DESERT
weather sand OASIS
weather leaves WINDY
weather bubbles CORAL
